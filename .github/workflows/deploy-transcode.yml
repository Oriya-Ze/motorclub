name: Deploy media transcode

# Deploys the media transcode Lambda when its code changes on main. It only reads S3 events
# and writes processed media, so it has no migration step and no public health endpoint.
# A failed code update leaves the previous image running.

on:
  push:
    branches: [main]
    paths:
      - backend/lambda_media/**
      - backend/Dockerfile.transcode
      - backend/requirements-transcode.txt
      - .github/workflows/deploy-transcode.yml
  workflow_dispatch:

concurrency:
  group: deploy-transcode-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  AWS_ROLE_ARN: arn:aws:iam::240401023776:role/motorclub-github-deploy
  ECR_REPOSITORY: motorclub-media-transcode-lambda
  LAMBDA_FUNCTION: motorclub-serverless-media-transcode

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: ref
        run: echo "image=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Lambda rejects image indexes, so build one linux/amd64 manifest without attestations.
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.transcode
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.ref.outputs.image }}
          cache-from: type=gha,scope=transcode-lambda
          cache-to: type=gha,mode=max,scope=transcode-lambda

      # Narrowed output: this repository's logs are public and the function configuration is not.
      - name: Update transcode Lambda
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          aws lambda update-function-code --function-name "$LAMBDA_FUNCTION" --image-uri "$IMAGE" \
            --query 'LastUpdateStatus' --output text
          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION"
          echo "### Deployed \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

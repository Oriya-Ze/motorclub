name: Deploy

# Every push to main deploys production. Tests, the frontend build, and the API image run in
# parallel; nothing touches production until all three pass. Then, in this order: the Neon
# migration, the API Lambda (rolled back if the health check fails), and the frontend.
# The migration runs before the new code because new code may read columns it adds.
#
# This repository is public, so its logs are too. Never print Lambda configuration or secrets:
# every AWS call that returns function configuration is narrowed with --query.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - backend/lambda_media/**
      - backend/Dockerfile.transcode
      - backend/requirements-transcode.txt
      - .github/workflows/deploy-transcode.yml
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1
  AWS_ROLE_ARN: arn:aws:iam::240401023776:role/motorclub-github-deploy
  ECR_REPOSITORY: motorclub-api-lambda
  LAMBDA_FUNCTION: motorclub-serverless-api
  FRONTEND_BUCKET: motorclub-serverless-frontend
  CLOUDFRONT_DISTRIBUTION: ESGAYJYZ7492K
  API_ORIGIN: https://api.motorclub.co.il

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: motorclub
          POSTGRES_PASSWORD: motorclub_dev
          POSTGRES_DB: motorclub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U motorclub"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://motorclub:motorclub_dev@localhost:5432/motorclub
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Migrate the test database
        run: alembic upgrade head

      - name: Test
        run: python -m pytest -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check and build
        env:
          VITE_API_URL: https://api.motorclub.co.il/api/v1
          VITE_MEDIA_BASE_URL: https://media.motorclub.co.il
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  api-image:
    name: API image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: ref
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Lambda rejects image indexes, so build one linux/amd64 manifest without attestations.
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.lambda
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.ref.outputs.image }}
          build-args: |
            APP_VERSION=${{ steps.ref.outputs.tag }}
          cache-from: type=gha,scope=api-lambda
          cache-to: type=gha,mode=max,scope=api-lambda

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build, api-image]
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ needs.api-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install migration tools
        run: pip install -r backend/requirements.txt

      - name: Migrate Neon
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          PYTHONPATH: .
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::NEON_DATABASE_URL is not set for the production environment"
            exit 1
          fi
          alembic upgrade head

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update API Lambda
        id: lambda
        run: |
          previous=$(aws lambda get-function --function-name "$LAMBDA_FUNCTION" --query 'Code.ImageUri' --output text)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Previous image: $previous"
          aws lambda update-function-code --function-name "$LAMBDA_FUNCTION" --image-uri "$IMAGE" \
            --query 'LastUpdateStatus' --output text
          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION"
          echo "Live image: $IMAGE"

      - name: Health check
        run: |
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 10 "$API_ORIGIN/health/ready" && curl -fsS --max-time 10 "$API_ORIGIN/health"; then
              echo
              exit 0
            fi
            sleep 3
          done
          echo "::error::The API did not become healthy on $IMAGE"
          exit 1

      - name: Roll back API Lambda
        if: failure() && steps.lambda.outputs.previous != ''
        env:
          PREVIOUS: ${{ steps.lambda.outputs.previous }}
        run: |
          aws lambda update-function-code --function-name "$LAMBDA_FUNCTION" --image-uri "$PREVIOUS" \
            --query 'LastUpdateStatus' --output text
          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION"
          echo "::warning::Rolled the API back to $PREVIOUS. The migration was not rolled back."

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      # No --delete: old hashed assets stay, so open tabs on the previous version keep working.
      - name: Upload frontend
        run: aws s3 sync frontend/dist "s3://$FRONTEND_BUCKET" --only-show-errors

      - name: Invalidate CDN
        run: |
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION" --paths "/*" \
            --query 'Invalidation.Id' --output text

      - name: Summary
        run: |
          {
            echo "### Deployed ${GITHUB_SHA::7}"
            echo "- API image: \`$IMAGE\`"
            echo "- Neon: migrated to head"
            echo "- Frontend: \`s3://$FRONTEND_BUCKET\`, CDN invalidated"
          } >> "$GITHUB_STEP_SUMMARY"
